
name: Build and Publish NGINX Image

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/build-image.yml'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/samson-olawoyin/devops-final-task-nginx

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate build metadata
        id: build
        shell: bash
        run: |
          echo "build_id=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.build.outputs.build_id }}
          build-args: |
            BUILD_ID=${{ steps.build.outputs.build_id }}
            BUILD_VERSION=${{ steps.build.outputs.build_version }}
            BUILD_DATE=${{ steps.build.outputs.build_date }}
