name: CI/CD Pipeline

on: push: branches: - main pull_request: branches: - main

permissions: contents: read

env: IMAGE_NAME: ghcr.io/samson-olawoyin/devops-final-task-nginx

jobs:

-------------------------
1. LINT
-------------------------

lint: name: Lint runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Install ShellCheck
    run: |
      sudo apt-get update
      sudo apt-get install -y shellcheck

  - name: Run ShellCheck
    run: shellcheck scripts/*.sh

  - name: Run Hadolint
    uses: hadolint/hadolint-action@v3.1.0
    with:
      dockerfile: app/Dockerfile

-------------------------
2. BUILD
-------------------------

build: name: Build Docker Image runs-on: ubuntu-latest needs: lint

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Build Docker image
    run: |
      docker build \
        --build-arg BUILD_ID=2 \
        --build-arg BUILD_VERSION=1.0.0 \
        --build-arg BUILD_DATE="$(date -u +%Y-%m-%d)" \
        --build-arg BUILD_SHA="${{ github.sha }}" \
        -t "$IMAGE_NAME:ci" \
        -f app/Dockerfile app

  - name: Save Docker image
    run: docker save "$IMAGE_NAME:ci" -o app-image.tar

  - name: Upload Docker image artifact
    uses: actions/upload-artifact@v4
    with:
      name: nginx-docker-image
      path: app-image.tar
      retention-days: 1

-------------------------
3. TEST
-------------------------

test: name: Test Docker Image runs-on: ubuntu-latest needs: build

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Download Docker image
    uses: actions/download-artifact@v4
    with:
      name: nginx-docker-image

  - name: Load Docker image
    run: docker load -i app-image.tar

  - name: Start Nginx container
    run: |
      docker run -d \
        --name nginx-ci \
        -p 8080:8080 \
        "$IMAGE_NAME:ci"

  - name: Wait for application readiness
    run: |
      READY=false

      for attempt in {1..30}; do
        if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
          echo "Application is ready."
          READY=true
          break
        fi

        echo "Waiting for Nginx... attempt $attempt/30"
        sleep 2
      done

      if [ "$READY" != "true" ]; then
        echo "Application failed to become ready."
        docker logs nginx-ci
        exit 1
      fi

  - name: Run application health check
    run: |
      bash scripts/healthcheck.sh http://127.0.0.1:8080/healthz

  - name: Cleanup container
    if: always()
    run: docker rm -f nginx-ci || true

-------------------------
4. PUBLISH
-------------------------

publish: name: Publish to GHCR runs-on: ubuntu-latest needs: test

if: github.event_name == 'push' && github.ref == 'refs/heads/main'

permissions:
  contents: read
  packages: write

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Login to GitHub Container Registry
    uses: docker/login-action@v3
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  - name: Build and push Docker image
    uses: docker/build-push-action@v6
    with:
      context: app
      file: app/Dockerfile
      push: true
      build-args: |
        BUILD_ID=2
        BUILD_VERSION=1.0.0
        BUILD_DATE=${{ github.event.head_commit.timestamp }}
        BUILD_SHA=${{ github.sha }}
      tags: |
        ghcr.io/samson-olawoyin/devops-final-task-nginx:${{ github.sha }}
        ghcr.io/samson-olawoyin/devops-final-task-nginx:latest